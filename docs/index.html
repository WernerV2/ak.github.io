<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bottle Detector</title>
<style>
  :root {
    --bg: #0b0e11;
    --panel: #14181d;
    --accent: #22c55e;
    --accent-dim: #16a34a;
    --warn: #6b7280;
    --text: #e5e7eb;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #header {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    z-index: 10;
    flex-shrink: 0;
  }
  #header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  #statusDot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--warn);
    margin-right: 6px;
    transition: background 0.2s ease;
  }
  #statusDot.ready { background: var(--accent); }
  #statusDot.error { background: var(--danger); }
  #viewport {
    position: relative;
    flex: 1;
    min-height: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #video, #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #video { transform: scaleX(var(--mirror, 1)); }
  #overlay { pointer-events: none; }
  #placeholder {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 30px;
    max-width: 320px;
  }
  #placeholder p {
    color: #9ca3af;
    font-size: 14px;
    line-height: 1.5;
    margin: 10px 0 20px;
  }
  .bigicon { font-size: 42px; margin-bottom: 6px; }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
    transition: transform 0.05s ease, opacity 0.2s ease;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.5; cursor: default; }
  #startBtn {
    background: var(--accent);
    color: #05130a;
  }
  #controls {
    position: absolute;
    bottom: 18px; left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 12px;
    z-index: 10;
  }
  .ctrlBtn {
    background: rgba(20,24,29,0.85);
    backdrop-filter: blur(6px);
    color: var(--text);
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    padding: 0;
  }
  #bottleBanner {
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%) translateY(-60px);
    background: var(--accent);
    color: #05130a;
    padding: 10px 20px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 4px 18px rgba(34,197,94,0.4);
    opacity: 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
    z-index: 10;
    white-space: nowrap;
  }
  #bottleBanner.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  #loadingOverlay {
    position: absolute;
    inset: 0;
    background: rgba(11,14,17,0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    gap: 14px;
  }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid #2a2f36;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingOverlay p { color: #9ca3af; font-size: 13px; }
  #errorBox {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 20;
    background: rgba(11,14,17,0.95);
    text-align: center;
  }
  #errorBox .msg {
    color: #fca5a5;
    font-size: 14px;
    line-height: 1.5;
    max-width: 320px;
  }
  #hidden { display: none !important; }
  #footer {
    padding: 6px 14px 10px;
    text-align: center;
    font-size: 11px;
    color: #6b7280;
    background: var(--panel);
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1><span id="statusDot"></span>Bottle Detector</h1>
    <span id="fpsLabel" style="font-size:11px;color:#6b7280;"></span>
  </div>

  <div id="viewport">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>

    <div id="placeholder">
      <div class="bigicon">📷</div>
      <p>Point your camera at objects. This app runs a live object-detection model in your browser and flags anything it recognizes as a <strong>bottle</strong>.</p>
      <button id="startBtn">Start Camera</button>
    </div>

    <div id="bottleBanner">🍾 Bottle detected</div>

    <div id="loadingOverlay" class="hidden">
      <div class="spinner"></div>
      <p id="loadingText">Loading detection model…</p>
    </div>

    <div id="errorBox" class="hidden">
      <div class="msg" id="errorMsg"></div>
    </div>

    <div id="controls" class="hidden">
      <button class="ctrlBtn" id="switchBtn" title="Switch camera">🔄</button>
      <button class="ctrlBtn" id="stopBtn" title="Stop">⏹️</button>
    </div>
  </div>

  <div id="footer">Detection runs fully on-device — nothing is uploaded.</div>
</div>

<script src="vendor/tf.min.js"></script>
<script src="vendor/coco-ssd.min.js"></script>
<script>
(function () {
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const ctx = overlay.getContext('2d');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const switchBtn = document.getElementById('switchBtn');
  const placeholder = document.getElementById('placeholder');
  const controls = document.getElementById('controls');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const loadingText = document.getElementById('loadingText');
  const errorBox = document.getElementById('errorBox');
  const errorMsg = document.getElementById('errorMsg');
  const statusDot = document.getElementById('statusDot');
  const bottleBanner = document.getElementById('bottleBanner');
  const fpsLabel = document.getElementById('fpsLabel');
  const app = document.getElementById('app');

  let model = null;
  let stream = null;
  let running = false;
  let facingMode = 'environment'; // back camera by default
  let rafId = null;
  let lastFrameTime = performance.now();
  let bottleVisible = false;
  let bottleHideTimer = null;

  function showError(message) {
    errorMsg.textContent = message;
    errorBox.classList.remove('hidden');
    statusDot.classList.add('error');
  }

  function hide(el) { el.classList.add('hidden'); }
  function show(el) { el.classList.remove('hidden'); }

  async function loadModel() {
    if (model) return model;
    loadingText.textContent = 'Loading detection model…';
    show(loadingOverlay);
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    hide(loadingOverlay);
    return model;
  }

  async function startCamera() {
    hide(errorBox);
    statusDot.classList.remove('error');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError('Camera access is not supported in this browser. Try opening this page in Safari (iOS) or Chrome (Android) over HTTPS.');
      return;
    }

    try {
      loadingText.textContent = 'Requesting camera access…';
      show(loadingOverlay);

      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };

      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      video.style.setProperty('--mirror', facingMode === 'user' ? -1 : 1);

      await new Promise((resolve) => {
        video.onloadedmetadata = () => resolve();
      });
      await video.play();

      resizeOverlay();
      await loadModel();

      hide(placeholder);
      hide(loadingOverlay);
      show(controls);
      statusDot.classList.add('ready');

      running = true;
      detectLoop();
    } catch (err) {
      hide(loadingOverlay);
      let msg = 'Could not access the camera. ';
      if (err && err.name === 'NotAllowedError') {
        msg += 'Camera permission was denied — check your browser/site settings and allow camera access, then try again.';
      } else if (err && err.name === 'NotFoundError') {
        msg += 'No camera was found on this device.';
      } else if (err && err.name === 'NotReadableError') {
        msg += 'The camera is already in use by another app.';
      } else {
        msg += 'This page needs to be served over HTTPS with camera permissions enabled.';
      }
      showError(msg);
    }
  }

  function stopCamera() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (stream) {
      stream.getTracks().forEach((t) => t.stop());
      stream = null;
    }
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    hide(controls);
    show(placeholder);
    hideBanner();
    statusDot.classList.remove('ready');
  }

  function resizeOverlay() {
    const rect = video.getBoundingClientRect();
    overlay.width = rect.width;
    overlay.height = rect.height;
  }

  window.addEventListener('resize', resizeOverlay);

  function showBanner() {
    bottleBanner.classList.add('show');
    if (navigator.vibrate) navigator.vibrate(40);
  }
  function hideBanner() {
    bottleBanner.classList.remove('show');
  }

  async function detectLoop() {
    if (!running || !model) return;

    const now = performance.now();
    const dt = now - lastFrameTime;
    lastFrameTime = now;
    fpsLabel.textContent = dt > 0 ? Math.round(1000 / dt) + ' fps' : '';

    try {
      const predictions = await model.detect(video, 20, 0.5);
      drawPredictions(predictions);
    } catch (e) {
      // model.detect can occasionally throw on a dropped frame; skip it
    }

    rafId = requestAnimationFrame(detectLoop);
  }

  function drawPredictions(predictions) {
    resizeOverlayIfNeeded();
    ctx.clearRect(0, 0, overlay.width, overlay.height);

    const scaleX = overlay.width / video.videoWidth;
    const scaleY = overlay.height / video.videoHeight;
    const mirrored = facingMode === 'user';

    let foundBottle = false;

    predictions.forEach((pred) => {
      const isBottle = pred.class === 'bottle';
      if (isBottle) foundBottle = true;

      let [x, y, w, h] = pred.bbox;
      x *= scaleX; y *= scaleY; w *= scaleX; h *= scaleY;
      if (mirrored) x = overlay.width - x - w;

      const color = isBottle ? '#22c55e' : 'rgba(156,163,175,0.55)';
      const lineWidth = isBottle ? 3 : 1.5;

      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.strokeRect(x, y, w, h);

      const label = `${pred.class} ${Math.round(pred.score * 100)}%`;
      ctx.font = isBottle ? '600 14px sans-serif' : '500 12px sans-serif';
      const textWidth = ctx.measureText(label).width;
      const padY = isBottle ? 22 : 18;

      ctx.fillStyle = isBottle ? '#22c55e' : 'rgba(75,85,99,0.75)';
      ctx.fillRect(x, y - padY, textWidth + 10, padY);
      ctx.fillStyle = isBottle ? '#05130a' : '#f3f4f6';
      ctx.fillText(label, x + 5, y - padY / 2 + 4);
    });

    if (foundBottle) {
      if (!bottleVisible) showBanner();
      bottleVisible = true;
      clearTimeout(bottleHideTimer);
      bottleHideTimer = setTimeout(() => {
        bottleVisible = false;
        hideBanner();
      }, 900);
    }
  }

  function resizeOverlayIfNeeded() {
    const rect = video.getBoundingClientRect();
    if (overlay.width !== rect.width || overlay.height !== rect.height) {
      overlay.width = rect.width;
      overlay.height = rect.height;
    }
  }

  startBtn.addEventListener('click', startCamera);
  stopBtn.addEventListener('click', stopCamera);
  switchBtn.addEventListener('click', async () => {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    stopCamera();
    await startCamera();
  });

  document.getElementById('errorBox').addEventListener('click', () => {
    hide(errorBox);
    show(placeholder);
  });
})();
</script>
</body>
</html>
